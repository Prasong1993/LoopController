name: Project Control API tests

on:
  push:
    branches:
      - project-control-api-cloudflare
  pull_request:
    branches:
      - project-control-api-cloudflare

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Run Worker acceptance tests
        run: npm test
